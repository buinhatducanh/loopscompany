<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1313"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#d43b1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="24" fill="url(#bgGrad6)"/>
  <rect width="600" height="340" rx="24" fill="url(#goldGlow)"/>
  <rect width="598" height="338" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Warranty Medal Icon Container -->
  <g transform="translate(300, 115)" filter="url(#shadow6)">
    <circle r="60" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="46" fill="rgba(0,0,0,0.5)"/>

    <!-- Gold Medal Rim -->
    <circle r="34" fill="url(#goldGrad)"/>
    <circle r="29" fill="#0b0d14"/>
    
    <!-- 18M text in center -->
    <text x="0" y="3" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">18M</text>
    <text x="0" y="18" fill="#fef08a" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BẢO HÀNH</text>

    <!-- Ribbons bottom -->
    <path d="M-14 26 L-24 50 L-10 44 L0 50 L-5 28 Z" fill="#d43b1f"/>
    <path d="M14 26 L24 50 L10 44 L0 50 L5 28 Z" fill="#b91c1c"/>
  </g>

  <!-- Warranty Card Badge -->
  <g transform="translate(120, 215)">
    <rect width="360" height="74" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Status Pill -->
    <rect x="18" y="14" width="86" height="20" rx="10" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <text x="61" y="28" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">1 ĐỔI 1 · 540D</text>

    <text x="114" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cam Kết Đồng Hành Suốt 18 Tháng</text>

    <text x="18" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Phát sinh lỗi đổi mới ngay lập tức hoặc hoàn tiền 100% qua Zalo 24/7.</text>
  </g>
</svg>
