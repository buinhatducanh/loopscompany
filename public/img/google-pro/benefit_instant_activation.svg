<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="zapGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d43b1f"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="24" fill="url(#bgGrad4)"/>
  <rect width="600" height="340" rx="24" fill="url(#zapGlow)"/>
  <rect width="598" height="338" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Google Cloud + Speed Bolt Icon Container -->
  <g transform="translate(300, 115)" filter="url(#shadow4)">
    <circle r="60" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="46" fill="rgba(0,0,0,0.45)"/>

    <!-- Google Cloud Silhouette outline -->
    <path d="M-28 6 A14 14 0 0 1 -14 -8 A20 20 0 0 1 18 -8 A16 16 0 0 1 30 6 L-28 6 Z" fill="rgba(255,255,255,0.2)"/>

    <!-- Lightning Bolt -->
    <path d="M3 -30 L-14 -2 L-2 -2 L-7 30 L16 -4 L3 -4 Z" fill="url(#boltGrad)"/>
  </g>

  <!-- 30 Seconds Auto Delivery Badge -->
  <g transform="translate(120, 215)">
    <rect width="360" height="74" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Status Pill -->
    <rect x="18" y="14" width="70" height="20" rx="10" fill="rgba(56, 189, 248, 0.18)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="53" y="28" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AUTO 30S</text>

    <text x="98" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tự Động Kích Hoạt Qua VietQR 24/7</text>

    <text x="18" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hệ thống webhook nhận diện chuyển khoản và cấp link ngay lập tức.</text>
  </g>
</svg>
