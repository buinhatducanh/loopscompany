<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131d"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d43b1f" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d43b1f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="24" fill="url(#bgGrad)"/>
  <rect width="600" height="340" rx="24" fill="url(#glowRed)"/>
  <rect width="598" height="338" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Grid Tech Subtle Lines -->
  <g opacity="0.07" stroke="#fff" stroke-width="1">
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="255" x2="600" y2="255"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- Google Drive Icon Container -->
  <g transform="translate(300, 115)" filter="url(#softShadow)">
    <!-- Back glass circle -->
    <circle r="60" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="46" fill="rgba(0,0,0,0.4)"/>
    
    <!-- Authentic Google Drive Icon -->
    <g transform="scale(0.85) translate(-60, -56)">
      <!-- Yellow Top bar -->
      <path d="M41.5 28.5 L78.5 28.5 L118.5 98 L81.5 98 Z" fill="#FFC107"/>
      <!-- Green Right bar -->
      <path d="M81.5 98 L118.5 98 L81.5 162 L44.5 162 Z" fill="#2BB741"/>
      <!-- Blue Left bar -->
      <path d="M44.5 162 L7.5 98 L41.5 28.5 L78.5 92.5 Z" fill="#2684FC"/>
    </g>
  </g>

  <!-- 2.000 GB Capacity Storage Meter Box -->
  <g transform="translate(130, 215)">
    <!-- Glass bar card -->
    <rect width="340" height="74" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Header info -->
    <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GOOGLE DRIVE STORAGE</text>
    <text x="320" y="28" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end">2.000 GB (2TB)</text>

    <!-- Progress Track -->
    <rect x="20" y="42" width="300" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="42" width="285" height="8" rx="4" fill="url(#barGrad)"/>

    <!-- Bottom subtext -->
    <text x="20" y="64" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Gốc: 15 GB</text>
    <text x="320" y="64" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">✓ Đã Mở Rộng 2TB</text>
  </g>
</svg>
