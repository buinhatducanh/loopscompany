<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f191b"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="photosGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="24" fill="url(#bgGrad3)"/>
  <rect width="600" height="340" rx="24" fill="url(#photosGlow)"/>
  <rect width="598" height="338" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Google Photos Pinwheel Icon -->
  <g transform="translate(300, 115)" filter="url(#shadow3)">
    <circle r="60" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="46" fill="rgba(0,0,0,0.45)"/>

    <!-- Authentic Google Photos 4-Petal Pinwheel -->
    <g transform="scale(1.2)">
      <!-- Top Red Petal -->
      <path d="M0 0 A14 14 0 0 1 14 -14 L14 -28 A14 14 0 0 0 0 -14 Z" fill="#EA4335" transform="rotate(0)"/>
      <!-- Right Green Petal -->
      <path d="M0 0 A14 14 0 0 1 14 -14 L14 -28 A14 14 0 0 0 0 -14 Z" fill="#34A853" transform="rotate(90)"/>
      <!-- Bottom Yellow Petal -->
      <path d="M0 0 A14 14 0 0 1 14 -14 L14 -28 A14 14 0 0 0 0 -14 Z" fill="#FBBC05" transform="rotate(180)"/>
      <!-- Left Blue Petal -->
      <path d="M0 0 A14 14 0 0 1 14 -14 L14 -28 A14 14 0 0 0 0 -14 Z" fill="#4285F4" transform="rotate(270)"/>
    </g>
  </g>

  <!-- Magic Editor & Original Quality Badge -->
  <g transform="translate(120, 215)">
    <rect width="360" height="74" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Badge Pills -->
    <rect x="18" y="14" width="86" height="20" rx="10" fill="rgba(16, 185, 129, 0.18)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <text x="61" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ORIGINAL 4K</text>

    <text x="114" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Google Photos &amp; Magic Editor AI</text>

    <text x="18" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sao lưu ảnh gốc không nén · Xóa vật thể thừa · Phục chế ảnh mờ.</text>
  </g>
</svg>
